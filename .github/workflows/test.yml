name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: go test ./...
      - run: go vet ./...
      - run: PYTHONPATH=internal/cloud/runtime python3 -m unittest discover -s internal/cloud/tests -v
      - run: bash scripts/install.sh "$RUNNER_TEMP/things-bin"
      - run: '"$RUNNER_TEMP/things-bin/things-cli" --help'
      - run: '"$RUNNER_TEMP/things-bin/things-cli" --cloud-data-dir "$RUNNER_TEMP/things-test-account" status'
      - run: '"$RUNNER_TEMP/things-bin/things-cli" --cloud-data-dir "$RUNNER_TEMP/things-test-account" logout'
